<style>
:root{--ink:#0c1e4a;--teal:#1f5fae;--gold:#e0ae3c;--red:#c8102e;--bg:#f3f6fb;--mut:#4a5a78;--card:#fff;--tx:#0c1e4a;--line:#d3dcea}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Cairo,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.8;transition:background .3s}
.w{max-width:960px;margin:auto;padding:0 18px}
nav{position:sticky;top:0;z-index:5;background:var(--ink);border-bottom:3px solid var(--gold)}

.tools{display:flex;gap:8px}
.tl{font:inherit;font-weight:600;font-size:15px;background:none;border:2px solid var(--gold);color:var(--gold);border-radius:20px;padding:2px 14px;cursor:pointer}
.hero{background:linear-gradient(135deg,var(--ink),var(--teal));color:#fff;padding:60px 0 70px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent 0 22px,rgba(224,174,60,.08) 22px 24px);pointer-events:none}
.hero .w{position:relative;z-index:1}
.hero h1{font-size:clamp(30px,7vw,52px);line-height:1.3;margin:0 0 12px;font-weight:800}
.hero p{font-size:19px;max-width:560px;color:#d3e0f5;margin:0 0 22px}
.btn{font:inherit;font-weight:800;font-size:18px;background:var(--gold);color:#0c1e4a;border:0;border-radius:10px;padding:12px 28px;cursor:pointer;text-decoration:none;display:inline-block}
.tl:focus-visible,.btn:focus-visible,.need:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tipbox{margin-top:22px;max-width:560px;background:rgba(255,255,255,.12);border:2px dashed var(--gold);border-radius:14px;padding:12px 16px;min-height:64px}

h2{font-size:28px;margin:46px 0 6px}
.sub{color:var(--mut);margin:0 0 20px}
.needs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.need{font:inherit;text-align:start;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;color:var(--tx);transition:transform .15s,border-color .15s}
.need:hover{transform:translateY(-3px);border-color:var(--teal)}
.need[aria-pressed=true]{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.need .ic{font-size:34px;display:block}
.need strong{font-size:19px;display:block}
.need .d{color:var(--mut);font-size:15px}
.panel{background:var(--card);border-radius:14px;padding:22px}
#guide{margin-top:18px;border-inline-start:6px solid var(--gold);min-height:80px}
#guide h3{margin:0 0 10px;font-size:23px}
#guide ol{margin:0;padding:0;list-style:none;counter-reset:s}

#guide li:before{content:counter(s);position:absolute;inset-inline-start:0;top:8px;width:36px;height:36px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:800}
.tip{margin-top:12px;background:rgba(224,174,60,.18);border-radius:10px;padding:10px 14px}
.dash{display:grid;grid-template-columns:200px 1fr;gap:22px;align-items:center}
.ring{width:170px;height:170px;border-radius:50%;margin:auto;display:grid;place-items:center;background:conic-gradient(var(--gold) 0%,var(--line) 0)}
.ring div{width:128px;height:128px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:34px;font-weight:800}
.chk label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.chk input{width:22px;height:22px;margin-top:5px;accent-color:var(--teal)}
#msg{font-weight:800;margin-top:8px;color:var(--gold)}
.week{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:space-between;border:2px solid var(--gold)}
.week h3{margin:0}
.week p{margin:4px 0 0}
.done{background:var(--ok,#1b7f4b);color:#fff}
footer{background:var(--ink);color:#cfd9ef;text-align:center;padding:20px;margin-top:60px}
#splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:linear-gradient(135deg,#0c1e4a,#1f5fae);transition:opacity .5s,visibility .5s}
#splash.hide{opacity:0;visibility:hidden}
#enter{font:inherit;background:none;border:0;color:#fff;cursor:pointer;text-align:center;padding:30px}
#enter .gl{display:grid;place-items:center;width:150px;height:150px;margin:0 auto 18px;border-radius:50%;border:4px solid var(--gold);font-size:76px;background:rgba(255,255,255,.1);animation:pl 2s ease-in-out infinite}
#enter strong{display:block;font-size:30px;font-weight:800}
#enter small{display:block;color:var(--gold);font-size:18px;margin-top:6px}
#enter:focus-visible{outline:3px solid var(--gold);outline-offset:6px;border-radius:20px}
@keyframes pl{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){#enter .gl{animation:none}#splash{transition:none}}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.sc{background:var(--card);border-radius:14px;padding:18px;border-top:5px solid var(--gold)}
.sc h3{margin:0 0 4px;font-size:20px}.sc b{color:var(--teal)}.sc p{margin:4px 0}
body.dark .sc b{color:var(--gold)}
.eco{display:grid;gap:12px}
.eco input{font:inherit;font-size:20px;width:140px;padding:8px 12px;border-radius:10px;border:2px solid var(--gold);background:var(--bg);color:var(--tx)}
.res{font-size:20px;font-weight:800;color:var(--teal)}
body.dark .res{color:var(--gold)}
.refs{margin:0;padding-inline-start:22px}
/* حركة وتدرجات */
body{background:linear-gradient(180deg,var(--bg),color-mix(in srgb,var(--teal) 12%,var(--bg)));background-attachment:fixed}
nav{border-bottom:0;background:linear-gradient(90deg,var(--ink),#16357a,var(--ink))}

.hero{background:linear-gradient(120deg,#0c1e4a,#1f5fae,#5b3fa0,#1f5fae,#0c1e4a);background-size:300% 300%;animation:shift 14s ease-in-out infinite}
.hero:before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 20% 30%,rgba(224,174,60,.35),transparent 28%),radial-gradient(circle at 80% 70%,rgba(122,167,255,.35),transparent 30%),radial-gradient(circle at 60% 15%,rgba(255,138,91,.25),transparent 22%);animation:drift 16s ease-in-out infinite alternate;pointer-events:none}
.hero h1{background:linear-gradient(90deg,#fff,var(--gold),#fff);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 7s linear infinite}
h2{background:linear-gradient(90deg,var(--tx),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}
body.dark h2{background:linear-gradient(90deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text}
.btn{background:linear-gradient(90deg,var(--gold),#ffcf6b,var(--gold));background-size:200% auto;transition:background-position .4s,transform .2s,box-shadow .2s}
.btn:hover{background-position:right center;transform:translateY(-2px);box-shadow:0 8px 20px rgba(224,174,60,.4)}
.btn.done{background:#1b7f4b}
.need{background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,var(--line),var(--line)) border-box}

.need .ic{transition:transform .3s}.need:hover .ic{transform:scale(1.25) rotate(-8deg)}

.sc{border-top:0;position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s;animation:pop .6s both}
.sc:before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(90deg,var(--gold),#ff8a5b,var(--teal))}
.sc:hover{transform:translateY(-6px);box-shadow:0 14px 28px rgba(31,95,174,.22)}
.sc:nth-child(2){animation-delay:.08s}.sc:nth-child(3){animation-delay:.16s}.sc:nth-child(4){animation-delay:.24s}.sc:nth-child(5){animation-delay:.32s}.sc:nth-child(6){animation-delay:.4s}
.sc{display:flex;flex-direction:column}
.sc .tb{margin-top:auto;align-self:flex-start;font-size:16px;padding:8px 20px}
.sc p:nth-of-type(2){margin-bottom:14px}
.sc h3 span{display:inline-block;animation:bob 3s ease-in-out infinite}

.tipbox{animation:glow 4s ease-in-out infinite}

@keyframes shift{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
@keyframes flow{to{background-position:200% 0}}
@keyframes drift{from{transform:translate(-3%,-2%) rotate(0)}to{transform:translate(4%,3%) rotate(6deg)}}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}

@keyframes glow{50%{box-shadow:0 0 0 10px rgba(224,174,60,.12),0 0 24px rgba(224,174,60,.3)}}

.qo.ok{background:#1b7f4b;color:#fff;border-color:#1b7f4b}.qo.bad{background:var(--red);color:#fff;border-color:var(--red)}
